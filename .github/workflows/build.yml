name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    # Liquid Glass APIs need the macOS 26 SDK or later.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build app
        run: ./scripts/build.sh

      - name: Package
        run: ditto -c -k --keepParent build/LiveWall.app LiveWall.zip

      - uses: actions/upload-artifact@v4
        with:
          name: LiveWall
          path: LiveWall.zip
