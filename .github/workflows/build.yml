name: Build and test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    # Liquid Glass APIs need the macOS 26 SDK or later.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Test
        run: ./scripts/test.sh

      # The same zip a release attaches: universal, named LiveWall.zip, with its SHA-256.
      - name: Build release zip
        run: ./scripts/release.sh

      - uses: actions/upload-artifact@v4
        with:
          name: LiveWall
          path: |
            dist/LiveWall.zip
            dist/LiveWall.zip.sha256
